name: Java CI Build

on:
  push:
    branches: [ "main-dp", "testing"]
  pull_request:
    branches: [ "main-dp", "testing" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile Java Files
      run: |
        cd src
        javac exceptions/*.java models/*.java service/*.java main/Main.java

    - name: Run Automated Test Script (Optional)
      run: |
        cd src
        # You can test your text file pipeline automatically here too!
        cat test_inputs.txt | java main.Main